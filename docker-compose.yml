# AVLizador en Docker: docker compose up --build  ->  http://localhost:8000
# Variables d'entorn: README.md (secció "Variables d'entorn") /
# README.es.md ("Variables de entorno"). Les dues taules i esta llista han
# de coincidir.
services:
  avlizador:
    build: .
    image: avlizador:1.2.0
    ports:
      # Només des d'este equip. Per a obrir-lo a la xarxa: "8000:8000"
      # (millor amb un proxy HTTPS davant).
      - "127.0.0.1:8000:8000"
    environment:
      AVLIZADOR_MODE: complet          # "complet" (motor + KenLM) o "motor" (només regles)
      AVLIZADOR_KENLM_DIR: /opt/kenlm  # fitxers del model, copiats de docker/kenlm/ en construir
      MAX_CARACTERS: 20000             # límit de text per petició
      MAX_TRADUCCIONS_SIMULTANIES: 2   # semàfor de concurrència (vore main.py)
      UVICORN_LOG_LEVEL: warning       # cap línia per petició
    # Sistema de fitxers de només lectura, sense privilegis.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g                      # spaCy + KenLM: ~1 GB (amb FLOR calien 4g)
    restart: unless-stopped
