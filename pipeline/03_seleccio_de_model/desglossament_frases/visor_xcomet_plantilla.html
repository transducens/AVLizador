<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XCOMET per frase</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@600&display=swap">
<style>
:root {
  --bg: #fafaf8; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e2e1dc; --soft: #f3f2ee;
  --minor: #fbeeb8; --major: #f8cfa0; --critical: #f3a99c; --partial: #9c9b94;
  --val: #1d7a4f; --cat: #b5611b; --accent: #2f5aa8; --bo: #1d7a4f; --dolent: #b33a2b; --dif: #2f5aa8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161615; --panel: #1f1f1d; --text: #ecebe6; --muted: #9c9b94; --line: #34342f; --soft: #262624;
    --minor: #4d4420; --major: #5e3d1c; --critical: #6b2a22; --partial: #7a7972;
    --val: #6fd3a0; --cat: #f0a35e; --accent: #8fb2f5; --bo: #6fd3a0; --dolent: #f08a7a; --dif: #8fb2f5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161615; --panel: #1f1f1d; --text: #ecebe6; --muted: #9c9b94; --line: #34342f; --soft: #262624;
  --minor: #4d4420; --major: #5e3d1c; --critical: #6b2a22; --partial: #7a7972;
  --val: #6fd3a0; --cat: #f0a35e; --accent: #8fb2f5; --bo: #6fd3a0; --dolent: #f08a7a; --dif: #8fb2f5;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--panel); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1 { font: 600 19px/1.3 "Space Grotesk", Inter, system-ui, sans-serif; margin: 0 0 8px; text-wrap: balance; }
h2 { font-size: 15px; margin: 0 0 8px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 14px; }
.controls label { display: flex; gap: 6px; align-items: center; color: var(--muted); }
select, input { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
.legend { margin-top: 8px; font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 14px; }
main { max-width: 1100px; margin: 0 auto; padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.nota-metode { color: var(--muted); }
.resum { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; font-size: 14px; }
.resum p { margin: 4px 0; }
.resum table { width: 100%; border-collapse: collapse; margin-top: 8px; }
.resum th, .resum td { text-align: left; padding: 4px 8px; border-top: 1px solid var(--line); }
.resum th { color: var(--muted); font-weight: 600; font-size: 12px; }
.resum td.n { text-align: right; font-variant-numeric: tabular-nums; }
.count { color: var(--muted); font-size: 14px; margin-bottom: 10px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
.cap { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; margin-bottom: 8px; }
.cap b { font-size: 15px; }
.nota { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tag { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 10px; padding: 0 7px; }
.tag.igual { color: var(--bo); border-color: var(--bo); }
.pos { color: var(--bo); } .neg { color: var(--dolent); }
.fila { display: grid; grid-template-columns: 120px 1fr; gap: 2px 12px; margin: 4px 0; }
.fila > * { min-width: 0; }
.fila .et { color: var(--muted); font-size: 13px; padding-top: 1px; }
.hip { font-size: 16px; }
.minor { background: var(--minor); border-radius: 2px; }
.major { background: var(--major); border-radius: 2px; }
.critical { background: var(--critical); border-radius: 2px; }
.parcial { outline: 1px dashed var(--partial); outline-offset: 1px; }
.mv { color: var(--val); font-weight: 600; }
.mc { color: var(--cat); font-weight: 600; }
.dif { text-decoration: underline 2px var(--dif); text-underline-offset: 3px; }
ul.trossos { margin: 6px 0 0; padding-left: 18px; font-size: 13px; }
ul.trossos li { margin: 1px 0; }
.cls { font-size: 11px; border-radius: 8px; padding: 0 6px; border: 1px solid var(--line); color: var(--muted); }
.cls.val { color: var(--val); border-color: var(--val); } .cls.cat { color: var(--cat); border-color: var(--cat); }
details { margin-top: 8px; font-size: 14px; }
summary { cursor: pointer; color: var(--accent); font-size: 13px; }
.altre { background: var(--soft); border-radius: 8px; padding: 6px 10px; margin-top: 6px; }
.altre .nm { font-weight: 600; font-size: 13px; }
button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: inherit; font-size: 13px; color: var(--accent); background: none; border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; cursor: pointer; }
.mes { text-align: center; margin: 16px 0; }
@media (max-width: 700px) {
  .fila { grid-template-columns: 1fr; }
  header { position: static; }
  .resum { overflow-x: auto; }
}
</style>
</head>
<body>
<header>
  <h1 id="titol"></h1>
  <div class="controls">
    <label>Subconjunt <select id="sub"><option value="">Tots</option><option>BOE</option><option>AVL</option></select></label>
    <label>Compara amb <select id="comp"></select></label>
    <label>Ordre <select id="ordre">
      <option value="asc">Nota més baixa primer</option>
      <option value="desc">Nota més alta primer</option>
      <option value="dasc">Més perd enfront de la comparació</option>
      <option value="ddesc">Més guanya enfront de la comparació</option>
      <option value="id">Per id</option>
    </select></label>
    <label>Errors <select id="err">
      <option value="">Totes les frases</option>
      <option value="amb">Amb algun error</option>
      <option value="major">Amb error greu o crític</option>
      <option value="sense">Sense errors</option>
    </select></label>
    <label>Tros en <select id="cls">
      <option value="">Qualsevol</option>
      <option value="val">forma valenciana</option>
      <option value="cat">forma catalana</option>
    </select></label>
    <label><input type="checkbox" id="nomesdif"> Només diferents de la referència</label>
    <label>Cerca <input id="cerca" size="16" placeholder="id o paraula"></label>
  </div>
  <div class="legend">
    <span>Error de XCOMET: <span class="minor">lleu</span> <span class="major">greu</span> <span class="critical">crític</span> <span class="minor parcial">tros de paraula</span></span>
    <span><span class="mv">verd</span> = forma valenciana del lèxic</span>
    <span><span class="mc">taronja</span> = forma catalana del lèxic</span>
    <span><span class="dif">subratllat</span> (referència) = on la traducció és diferent</span>
  </div>
</header>
<main>
  <section class="resum" id="resum"></section>
  <div class="count" id="count"></div>
  <div id="llista"></div>
  <div class="mes"><button id="mes" hidden>Mostra'n més</button></div>
</main>
<script>
const D = /*DADES*/null;
const [SIS, NOMSIS] = D.sistema;
const NOM = Object.fromEntries(D.compara);
const $ = (id) => document.getElementById(id);
const PAS = 40, EMPAT = 0.5;
const SEV = { minor: 1, major: 2, critical: 3 };
const NOMSEV = { minor: "lleu", major: "greu", critical: "crític" };
const NOMCLS = { val: "forma valenciana", cat: "forma catalana", neutra: "neutra", no_trobat: "no trobat" };
let mostrades = PAS;

$("titol").textContent = `XCOMET-XL sense referència: ${NOMSIS}, frase a frase`;
document.title = `XCOMET ${NOMSIS}`;
for (const [s, n] of D.compara) $("comp").add(new Option(n, s));

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const f = (v, d = 2) => v === null || v === undefined ? "—" : v.toFixed(d).replace(".", ",");
const sg = (v, d = 2) => v === null || v === undefined ? "—" : (v > 0 ? "+" : "") + f(v, d);
const cl = (v) => v > EMPAT ? "pos" : v < -EMPAT ? "neg" : "";
const mitj = (vs) => vs.length ? vs.reduce((a, b) => a + b, 0) / vs.length : null;
const reEsc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const LL = "[\\p{L}\\p{N}·]";

// Situa cada tros d'error en el text: primer com a paraula sencera, si no
// com a tros de paraula; si no hi és, va a la llista de «no trobats».
function pinta(text, trossos, mv, mc) {
  const n = text.length, sev = new Array(n).fill(0), parc = new Array(n).fill(false), usat = new Array(n).fill(false);
  for (const t of trossos) {
    const txt = (t.text || "").trim();
    if (!txt) continue;
    let p = -1, len = txt.length, parcial = false;
    const re = new RegExp(`(?<!${LL})${reEsc(txt)}(?!${LL})`, "giu");
    for (const m of text.matchAll(re)) if (!usat[m.index]) { p = m.index; break; }
    if (p < 0) {
      const low = text.toLowerCase(), q = txt.toLowerCase();
      for (let k = low.indexOf(q); k >= 0; k = low.indexOf(q, k + 1)) if (!usat[k]) { p = k; parcial = true; break; }
    }
    if (p < 0) continue;
    for (let k = p; k < p + len; k++) { sev[k] = Math.max(sev[k], SEV[t.sev] || 1); parc[k] = parc[k] || parcial; usat[k] = true; }
  }
  const val = new Set(mv), cat = new Set(mc), m = new Array(n).fill("");
  for (const mm of text.matchAll(/[\p{L}\p{N}·]+/gu)) {
    const w = mm[0].toLowerCase(), c = val.has(w) ? "mv" : cat.has(w) ? "mc" : "";
    if (c) for (let k = mm.index; k < mm.index + mm[0].length; k++) m[k] = c;
  }
  const nomS = ["", "minor", "major", "critical"];
  let html = "", i = 0;
  while (i < n) {
    let k = i;
    while (k < n && sev[k] === sev[i] && parc[k] === parc[i] && m[k] === m[i]) k++;
    const c = [nomS[sev[i]], parc[i] ? "parcial" : "", m[i]].filter(Boolean).join(" ");
    html += c ? `<span class="${c}">${esc(text.slice(i, k))}</span>` : esc(text.slice(i, k));
    i = k;
  }
  return html;
}

function llistaTrossos(trossos) {
  if (!trossos.length) return `<div class="et" style="font-size:13px;color:var(--muted)">Cap error marcat.</div>`;
  return `<ul class="trossos">${trossos.map((t) =>
    `<li>«${esc(t.text)}»${t.paraula ? ` <span class="et">(en «${esc(t.paraula)}»)</span>` : ""} · ${NOMSEV[t.sev] || esc(t.sev)} · confiança ${f(t.conf)} <span class="cls ${t.classe}">${NOMCLS[t.classe] || t.classe}</span></li>`
  ).join("")}</ul>`;
}

function resum() {
  const fs = D.frases;
  const per = (sub) => mitj(fs.filter((x) => !sub || x.sub === sub).map((x) => x.x));
  const tr = fs.flatMap((x) => x.tr);
  const nsev = (s) => tr.filter((t) => t.sev === s).length, ncls = (c) => tr.filter((t) => t.classe === c).length;
  let files = "";
  for (const [s, n] of D.compara) {
    const ds = fs.filter((x) => x.comp[s]).map((x) => x.x - x.comp[s].x);
    const ms = mitj(fs.filter((x) => x.comp[s]).map((x) => x.comp[s].x));
    files += `<tr><td>${esc(n)}</td><td class="n">${f(ms)}</td><td class="n">${ds.filter((d) => d > EMPAT).length}</td>
      <td class="n">${ds.filter((d) => Math.abs(d) <= EMPAT).length}</td><td class="n">${ds.filter((d) => d < -EMPAT).length}</td>
      <td class="n ${cl(mitj(ds))}">${sg(mitj(ds))}</td></tr>`;
  }
  $("resum").innerHTML = `<h2>Resum (${fs.length} frases del manual)</h2>
    <p class="nota-metode">XCOMET-XL en mode sense referència (qe): la nota només depén del català d'entrada i de la traducció. La referència valenciana del manual no entra en el càlcul; es mostra només per a comparar.</p>
    <p>Nota mitjana <b>${f(per(""))}</b> (BOE ${f(per("BOE"))}, AVL ${f(per("AVL"))}). Frases amb algun error: <b>${fs.filter((x) => x.tr.length).length}</b>;
    iguals a la referència: ${fs.filter((x) => x.igual).length}.</p>
    <p>Trossos d'error: ${tr.length} (lleus ${nsev("minor")}, greus ${nsev("major")}, crítics ${nsev("critical")}).
    Cauen en una forma valenciana del lèxic ${ncls("val")}, en una catalana ${ncls("cat")}, en paraules neutres ${ncls("neutra")} (quan XCOMET marca un tros de paraula, es classifica la paraula sencera).</p>
    <table><thead><tr><th>${esc(NOMSIS)} enfront de</th><th>Nota mitjana</th><th>Guanya ${esc(NOMSIS)}</th><th>Empat (±${f(EMPAT, 1)})</th><th>Perd</th><th>Diferència mitjana</th></tr></thead>
    <tbody>${files}</tbody></table>`;
}

function filtra() {
  const sub = $("sub").value, c = $("comp").value, ordre = $("ordre").value, err = $("err").value,
        cls = $("cls").value, nomesdif = $("nomesdif").checked, q = $("cerca").value.trim().toLowerCase();
  let fs = D.frases.filter((x) => (!sub || x.sub === sub)
    && (!nomesdif || !x.igual)
    && (err !== "amb" || x.tr.length) && (err !== "sense" || !x.tr.length)
    && (err !== "major" || x.tr.some((t) => SEV[t.sev] >= 2))
    && (!cls || x.tr.some((t) => t.classe === cls))
    && (!q || x.id.toLowerCase().includes(q) || x.hip.toLowerCase().includes(q)
        || x.entrada.toLowerCase().includes(q) || x.referencia.toLowerCase().includes(q)));
  const d = (x) => x.comp[c] ? x.x - x.comp[c].x : null;
  if (ordre === "asc") fs.sort((a, b) => a.x - b.x);
  else if (ordre === "desc") fs.sort((a, b) => b.x - a.x);
  else if (ordre === "dasc") fs.sort((a, b) => (d(a) ?? 1e9) - (d(b) ?? 1e9));
  else if (ordre === "ddesc") fs.sort((a, b) => (d(b) ?? -1e9) - (d(a) ?? -1e9));
  else fs.sort((a, b) => a.id.localeCompare(b.id));
  return { fs, c };
}

function render() {
  const { fs, c } = filtra();
  $("count").textContent = `${fs.length} frases (nota mitjana ${f(mitj(fs.map((x) => x.x)))})`;
  let html = "";
  for (const x of fs.slice(0, mostrades)) {
    const dc = x.comp[c] ? x.x - x.comp[c].x : null;
    const ref = x.refdif.map(([t, dif]) => dif ? `<span class="dif">${esc(t)}</span>` : esc(t)).join(" ");
    const altres = D.compara.filter(([s]) => x.comp[s]).map(([s, n]) => {
      const o = x.comp[s], dd = x.x - o.x;
      return `<div class="altre"><span class="nm">${esc(n)}</span> · ${f(o.x)} · ${esc(NOMSIS)} − ${esc(n)}: <span class="${cl(dd)}">${sg(dd)}</span>
        <div>${pinta(o.h, o.tr, o.mv, o.mc)}</div></div>`;
    }).join("");
    html += `<article class="card">
      <div class="cap"><b>${esc(x.id)}</b><span class="tag">${x.sub}</span>
        <span class="nota">${f(x.x)}</span>
        ${x.igual ? '<span class="tag igual">= referència</span>' : ""}
        <span class="tag">GD ${f(x.gd, 2)}</span>
        ${c ? `<span>${esc(NOMSIS)} − ${esc(NOM[c])}: <span class="${cl(dc)}">${sg(dc)}</span></span>` : ""}</div>
      <div class="fila"><span class="et">Català</span><span>${esc(x.entrada)}</span></div>
      <div class="fila"><span class="et">${esc(NOMSIS)}</span><span class="hip">${pinta(x.hip, x.tr, x.mv, x.mc)}${llistaTrossos(x.tr)}</span></div>
      <div class="fila"><span class="et">Referència</span><span>${ref}</span></div>
      ${altres ? `<details><summary>Altres sistemes</summary>${altres}</details>` : ""}
    </article>`;
  }
  $("llista").innerHTML = html;
  $("mes").hidden = fs.length <= mostrades;
}

for (const id of ["sub", "comp", "ordre", "err", "cls", "nomesdif"]) $(id).addEventListener("change", () => { mostrades = PAS; render(); });
$("cerca").addEventListener("input", () => { mostrades = PAS; render(); });
$("mes").addEventListener("click", () => { mostrades += PAS; render(); });
resum();
render();
</script>
</body>
</html>
