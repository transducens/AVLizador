[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "avlizador"
version = "1.2.0"
description = "Traductor dialectal català -> valencià (norma AVL) i Grau Dialectal (GD, GDV, GDC). Només CPU."
readme = "README.md"
requires-python = ">=3.10"
# Apache 2.0 (decisió del grup, 02/11/2026). Les peces de tercers (model
# d'spaCy GPL-3.0, KenLM LGPL-2.1, FLOR-760M, gplsi, BOE...) i les seues
# llicències: NOTICE.
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Transducens, Universitat d'Alacant" }]
keywords = ["valencià", "català", "traducció dialectal", "AVL", "spaCy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Natural Language :: Catalan",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "spacy>=3.8,<3.9",
    # Model català de spaCy (no és a PyPI: la wheel oficial de spaCy).
    "ca_core_news_md @ https://github.com/explosion/spacy-models/releases/download/ca_core_news_md-3.8.0/ca_core_news_md-3.8.0-py3-none-any.whl",
]

[project.optional-dependencies]
# FLOR-760M (`translate_cat_val(text, model="flor")`): el model per defecte
# fins al 12/11/2026; ara opcional.
# Per a torch només CPU: --extra-index-url https://download.pytorch.org/whl/cpu
ml = [
    "torch>=2.2",
    "transformers>=4.45",
    # La 2.x va trencar transformers el 29/10/2026.
    "huggingface_hub>=0.24,<2.0",
]
# KenLM: el model de llengua PER DEFECTE des del 13/11/2026 (sense ell,
# `translate_cat_val` usa el motor sol i avisa). Es compila en instal·lar-lo
# (en Windows cal compilador; la imatge Docker és Linux). Els fitxers del
# model van a banda: AVLIZADOR_KENLM_DIR.
kenlm = ["kenlm>=0.2"]
avaluacio = ["sacrebleu>=2.4"]
# Interfície web i API (`avlizador web`; vore documentacio/hoja_de_ruta_interfaz_docker.md).
web = ["fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1"]
dev = ["pytest>=8", "sacrebleu>=2.4", "fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1", "httpx>=0.27"]

[project.scripts]
avlizador = "avlizador.cli:main"

[project.urls]
Repository = "https://github.com/transducens/AVLizador"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"avlizador.traductor_cat_val" = ["data/*.json", "data/*.txt"]
"avlizador.web" = ["plantilles/*.html", "static/*", "textos/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
